[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ouros-audience-engine"
version = "0.1.0"
description = "Deterministic audience snapshots for Ouros tips"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.115.6",
  "PyJWT[crypto]>=2.14,<3",
  "pydantic-settings==2.7.0",
  "psycopg[binary]==3.2.10",
  "pyroaring==1.0.3",
  "pymongo[srv]==4.10.1",
  "redis==5.2.1",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.8.6",
]

[project.scripts]
ouros-audience-engine = "ouros_audience_engine.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ouros_audience_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ouros_audience_engine/api/internal.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
