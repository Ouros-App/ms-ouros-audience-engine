services:
  postgres:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: audience
      POSTGRES_USER: audience_owner
      POSTGRES_PASSWORD: audience_owner_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/000_roles.sql:/docker-entrypoint-initdb.d/000_roles.sql:ro
      - ./docker/postgres/001_source_schema.sql:/docker-entrypoint-initdb.d/001_source_schema.sql:ro
      - ./migrations/001_audience_metadata.sql:/docker-entrypoint-initdb.d/002_audience_metadata.sql:ro
      - ./docker/postgres/003_grants.sql:/docker-entrypoint-initdb.d/003_grants.sql:ro
      - ./docker/postgres/004_demo_seed.sql:/docker-entrypoint-initdb.d/004_demo_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audience_owner -d audience"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      attempt=0; until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do attempt=$$((attempt + 1)); [ "$$attempt" -lt 60 ] || exit 1; sleep 1; done &&
      mc mb --ignore-existing local/ouros-audience &&
      mc anonymous set none local/ouros-audience

  api:
    build: .
    environment:
      ENVIRONMENT: development
      SERVICE_TOKEN: ${SERVICE_TOKEN:-local-only-change-me}
      SOURCE_DATABASE_URL: postgresql://audience_source:audience_source_local_only@postgres:5432/audience
      METADATA_DATABASE_URL: postgresql://audience_metadata:audience_metadata_local_only@postgres:5432/audience
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: ouros-audience
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_USE_SSL: "false"
      CACHE_TTL_SECONDS: "3600"
      AUDIENCE_CONFIG_PATH: /app/config/audiences.demo.yaml
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
